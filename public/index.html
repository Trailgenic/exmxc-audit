<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Entity Clarity Evidence — v2 Pilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg:#050914;
      --panel:#0b1224;
      --border:#1e2a4a;
      --text:#e6ebff;
      --muted:#9aa4c7;
      --accent:#4f7cff;
      --green:#22c55e;
      --amber:#fbbf24;
      --red:#ef4444;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(circle at top,#0a1024,#030611);
      color:var(--text);
    }

    .container {
      max-width:1200px;
      margin:40px auto;
      padding:0 20px 40px;
    }

    h1 {
      margin:0 0 16px;
      font-size:24px;
      font-weight:600;
    }

    .input-row {
      display:flex;
      gap:12px;
      margin-bottom:22px;
    }

    .input-row input {
      flex:1;
      padding:14px 16px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
    }

    .input-row button {
      padding:14px 22px;
      border-radius:10px;
      border:none;
      background:linear-gradient(135deg,#4f7cff,#6f9bff);
      color:white;
      font-weight:600;
      cursor:pointer;
      min-width:120px;
    }

    .input-row button:disabled {
      opacity:.6;
      cursor:default;
    }

    .grid {
      display:grid;
      grid-template-columns:1.1fr 1fr;
      gap:20px;
      margin-bottom:20px;
    }

    .panel {
      background:linear-gradient(180deg,#0b1224,#060b1c);
      border:1px solid var(--border);
      border-radius:14px;
      padding:20px 22px;
    }

    .panel h2,
    .panel h3 {
      margin-top:0;
      margin-bottom:10px;
      font-size:16px;
      font-weight:600;
    }

    /* Strategic posture / score */
    .posture-header {
      margin-bottom:12px;
    }

    .posture-label {
      font-size:14px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .posture-bar {
      position:relative;
      height:8px;
      border-radius:999px;
      background:#020617;
      overflow:hidden;
    }

    .posture-fill {
      position:absolute;
      top:0;
      left:0;
      height:100%;
      width:0%;
      background:var(--green);
      transition:width .35s ease;
    }

    .score-row {
      display:flex;
      align-items:center;
      gap:18px;
      margin-top:22px;
    }

    .score-circle {
      width:120px;
      height:120px;
      border-radius:50%;
      border:2px solid var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
    }

    .score-circle span {
      font-size:34px;
      font-weight:700;
    }

    .score-meta {
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:14px;
    }

    .score-meta-label {
      color:var(--muted);
    }

    /* Tier stability */
    .tier-row {
      margin-top:8px;
      margin-bottom:10px;
    }

    .tier-label-line {
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:13px;
      margin-bottom:4px;
    }

    .tier-label-line span.tier-name {
      color:var(--text);
    }

    .tier-label-line span.tier-score {
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }

    .tier-bar {
      position:relative;
      height:6px;
      border-radius:999px;
      background:#020617;
      overflow:hidden;
    }

    .tier-bar-fill {
      position:absolute;
      top:0;
      left:0;
      height:100%;
      width:0%;
      background:var(--accent);
      transition:width .35s ease;
    }

    /* Signal breakdown */
    #signalsList {
      margin:0;
      padding-left:18px;
      font-size:13px;
    }

    #signalsList li {
      margin-bottom:3px;
    }

    #signalsList em {
      font-style:normal;
    }

    /* Raw JSON */
    details {
      margin-top:18px;
    }

    details summary {
      cursor:pointer;
      font-size:14px;
      font-weight:500;
    }

    pre {
      margin-top:10px;
      background:#020617;
      border-radius:10px;
      padding:14px;
      font-size:12px;
      max-height:360px;
      overflow:auto;
      color:var(--muted);
    }

    @media (max-width: 900px){
      .grid {
        grid-template-columns:1fr;
      }
      .score-row {
        flex-direction:row;
      }
    }

    @media (max-width: 640px){
      .score-row {
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Entity Clarity Evidence — v2 Pilot</h1>

    <div class="input-row">
      <input id="urlInput" placeholder="example.com" />
      <button id="runBtn">Run Audit</button>
    </div>

    <div id="results" style="display:none;">
      <div class="grid">
        <!-- Declared access -->
        <div class="panel">
          <h2>Declared Access</h2>
          <div class="posture-header">
            <div id="postureLabel" class="posture-label">—</div>
            <div class="posture-bar">
              <div id="postureFill" class="posture-fill"></div>
            </div>
          </div>

          <div class="score-row">
            <div class="score-circle">
              <span id="scoreValue">—</span>
              <div style="font-size:11px;color:var(--muted);margin-top:4px;">
                Legacy Website Diagnostic
              </div>
            </div>
            <div class="score-meta">
              <div class="score-meta-label">V2 Review Coverage</div>
              <div id="scoreBand">—</div>
            </div>
          </div>
        </div>

        <!-- Legacy proxy breakdown -->
        <div class="panel">
          <h3>Legacy Proxy Breakdown</h3>

          <div class="tier-row">
            <div class="tier-label-line">
              <span class="tier-name">Graph and content proxies</span>
              <span id="tier1Score" class="tier-score">0%</span>
            </div>
            <div class="tier-bar">
              <div id="tier1Bar" class="tier-bar-fill"></div>
            </div>
          </div>

          <div class="tier-row">
            <div class="tier-label-line">
              <span class="tier-name">Structured-data proxies</span>
              <span id="tier2Score" class="tier-score">0%</span>
            </div>
            <div class="tier-bar">
              <div id="tier2Bar" class="tier-bar-fill"></div>
            </div>
          </div>

          <div class="tier-row">
            <div class="tier-label-line">
              <span class="tier-name">Page-hygiene proxies</span>
              <span id="tier3Score" class="tier-score">0%</span>
            </div>
            <div class="tier-bar">
              <div id="tier3Bar" class="tier-bar-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Signal breakdown -->
      <div class="panel">
        <h3>Legacy Diagnostic Details</h3>
        <ul id="signalsList"></ul>
      </div>

      <!-- Raw JSON -->
      <div class="panel">
        <details>
          <summary>Raw JSON</summary>
          <pre id="raw"></pre>
        </details>
      </div>
    </div>
  </div>

  <script>
    const runBtn = document.getElementById("runBtn");
    const results = document.getElementById("results");

    runBtn.onclick = async () => {
      const url = document.getElementById("urlInput").value.trim();
      if (!url) return;

      runBtn.disabled = true;
      runBtn.textContent = "Running…";

      try {
        const res = await fetch(`/api/audit?url=${encodeURIComponent(url)}`);
        if (!res.ok) {
          throw new Error("Bad response status " + res.status);
        }
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || "Audit failed");
        }

        // ---- show results ----
        results.style.display = "block";

        /* =========================
           CAPABILITY SCORE
        ==========================*/
        const score = data.legacy_diagnostic?.score;
        document.getElementById("scoreValue").textContent = Number.isFinite(score) ? score : "—";
        const coverage = data.assessment?.coverage;
        document.getElementById("scoreBand").textContent = coverage
          ? `${coverage.assessed}/${coverage.total} checks reviewed`
          : "Not reviewed";

        /* =========================
           STRATEGIC POSTURE BAR
        ==========================*/
        const postureFill = document.getElementById("postureFill");
        const postureLabel = document.getElementById("postureLabel");

        const delivery = data.collection?.fetch_status || "unknown";
        const access = data.declared_access?.posture || "unknown";
        postureFill.style.width = access === "unknown" ? "0%" : "100%";

        if (delivery !== "delivered") {
          postureFill.style.background = "var(--muted)";
          postureLabel.textContent = `Delivery observation: ${delivery}`;
        } else if (access === "restrictive") {
          postureFill.style.background = "var(--red)";
          postureLabel.textContent = "Declared policy: Restrictive";
        } else if (access === "selective") {
          postureFill.style.background = "var(--amber)";
          postureLabel.textContent = "Declared policy: Selective";
        } else if (access === "permissive") {
          postureFill.style.background = "var(--green)";
          postureLabel.textContent = "Declared policy: Permissive";
        } else {
          postureFill.style.background = "var(--muted)";
          postureLabel.textContent = "Declared policy: Unknown";
        }

        /* =========================
           TIER STABILITY (WITH SCORES)
        ==========================*/
        function applyTier(barId, labelId, tierObj) {
          const barEl = document.getElementById(barId);
          const labelEl = document.getElementById(labelId);

          if (!barEl || !labelEl || !tierObj) return;

          const pct = Math.round(tierObj.normalized ?? 0);
          barEl.style.width = pct + "%";
          barEl.title = pct + "% stability";
          labelEl.textContent = pct + "%";
        }

        applyTier("tier1Bar", "tier1Score", data.legacy_diagnostic?.tiers?.tier1);
        applyTier("tier2Bar", "tier2Score", data.legacy_diagnostic?.tiers?.tier2);
        applyTier("tier3Bar", "tier3Score", data.legacy_diagnostic?.tiers?.tier3);

        /* =========================
           SIGNAL BREAKDOWN
        ==========================*/
        const signalsEl = document.getElementById("signalsList");
        if (signalsEl) {
          signalsEl.innerHTML = (data.legacy_diagnostic?.signals || [])
            .map(r =>
              `<li><strong>${r.key}</strong> — ${r.percent}%` +
              (r.notes ? ` <em style="color:#9aa4c7">${r.notes}</em>` : "") +
              `</li>`
            )
            .join("");
        }

        /* =========================
           RAW JSON
        ==========================*/
        const rawEl = document.getElementById("raw");
        if (rawEl) {
          rawEl.textContent = JSON.stringify(data, null, 2);
        }

      } catch (err) {
        console.error(err);
        alert("Request failed");
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "Run Audit";
      }
    };
  </script>
</body>
</html>
